# Release: push a tag equal to the manifest version (for example 1.0.0, no "v"
# prefix) and this workflow builds the plugin, attests the build provenance and
# creates a DRAFT GitHub release with main.js, manifest.json and styles.css.
# Review the draft, add release notes, then publish it.
#
# One-time repository setting: Settings > Actions > General > Workflow
# permissions > "Read and write permissions".
name: Release

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  # No dependency cache in a job with write permissions
                  # (setup-node recommends this for privileged workflows).
                  package-manager-cache: false

            - name: Check that the tag matches manifest.json
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "Tag $tag does not match manifest.json version $version" >&2
                    exit 1
                  fi

            - name: Install, lint, test and build
              run: |
                  npm ci
                  npm run lint -- --max-warnings=0
                  npm test
                  npm run build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --generate-notes \
                    main.js manifest.json styles.css
