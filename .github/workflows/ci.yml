# Continuous integration: lint, test and build on every push and pull request.
name: CI

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # vitest 5 requires Node ^22.12 or >= 24 (Node 20 reached end of life in April 2026).
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint (zero warnings, same rules as the community directory scanner and stricter)
              run: npm run lint -- --max-warnings=0

            - name: Unit tests
              run: npm test

            - name: Production build
              run: npm run build
