# Keep dependencies current, but hold back major versions that the Obsidian
# lint toolchain does not support yet (checked 2026-10-01):
# - typescript-eslint 8 supports TypeScript < 6.1
# - eslint-plugin-obsidianmd 0.4 peers @eslint/js ^9
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          dev-dependencies:
              dependency-type: development
      ignore:
          - dependency-name: typescript
            versions: ['>=6.1.0']
          - dependency-name: '@eslint/js'
            versions: ['>=10.0.0']
          - dependency-name: eslint
            versions: ['>=10.0.0']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
